# plAI ball configuration. Non-secret tunables live here; secrets (API keys)
# remain in .env. Edit values here to change pipeline behavior without touching
# code. No restart needed — each pipeline run reads this file fresh.

[llm]
# Creativity for transcript generation. 0.2 was the v1 default (factual); 0.7
# gives the two-host banter more life.
temperature = 0.7

[audio]
elevenlabs_model = "eleven_v3"
# Max characters per ElevenLabs API call. Fewer/larger chunks mean fewer
# audible stitching seams, but ElevenLabs imposes its own request-size limit.
chunk_size = 1900
# Silence length injected for each [PAUSE] marker in the transcript.
pause_duration_ms = 1000
# Shared seed across all ElevenLabs calls so voices don't drift between
# chunks. Change to resample the whole episode with a new voice take.
seed = 42

[audio.voices]
# ElevenLabs voice IDs. Current picks from the public default library:
#   Adam  — "Dominant, Firm"                (Abe)
#   Laura — "Enthusiast, Quirky Attitude"   (Bailey)
abe = "pNInz6obpgDQGcFmaJgB"
bailey = "FGY2WhTYpPnrIDTdsKH5"

[rss]
# Number of episodes retained in the published RSS feed.
max_episodes = 7

[s3]
# Bucket for audio, transcript, and archive uploads. Also used to build the
# public URLs embedded in the RSS feed.
bucket = "plai-ball"

[data]
# Base URL for ESPN scraping. Centralized here so a future mirror or cache
# URL only needs one edit.
espn_base_url = "https://www.espn.com"
# Seconds to sleep between sequential ESPN requests to stay polite. Also
# the default for --delay on the CLI.
http_delay_seconds = 2
